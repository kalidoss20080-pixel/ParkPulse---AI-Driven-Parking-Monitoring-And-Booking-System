<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beyond Boundaries | Smart Parking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">Beyond Boundaries <span>Smart Parking</span></a>
  <nav><a href="{{ url_for('index') }}">Driver</a><a href="{{ url_for('operator') }}">Operator</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Smart Parking Slot Detection System · Prototype</footer>
<script src="{{ url_for('static', filename='camera.js') }}"></script>
</body>
</html>
